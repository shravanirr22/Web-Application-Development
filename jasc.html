<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Student Registration Portal</title>
		<link rel="stylesheet" href="style.css" />
		<style>
			/* Page-specific styles */
			.container {
				max-width: 900px;
				margin: 28px auto;
			form .row {
				display: grid;
				grid-template-columns: 1fr 1fr;
			form label {
				font-size: 0.9rem;
				color: #333;
			form input,
			form select {
				width: 100%;
			.actions {
				display: flex;
				gap: 10px;
			.primary {
				background: #6b46ff;
				color: white;
			table.students {
				width: 100%;
				border-collapse: collapse;
			.cards {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			.card {
				padding: 14px;
				border-radius: 12px;
			.card h4 {
				margin: 0 0 6px 0;
				color: #2b2350;
			.muted {
				color: #6c6a7a;
				font-size: 0.9rem;
		</style>
	</head>
	<body>
		<div class="container">
			<h2>Student Registration Portal</h2>

			<form id="studentForm">
				<div class="row">
					<div>
						<label for="name">Full name</label>
						<input type="text" id="name" name="name" required />
					</div>
					<div>
						<label for="email">Email</label>
						<input type="email" id="email" name="email" required />
	</div>

	<div class="row">
					<div>
						<label for="course">Course</label>
						<input type="text" id="course" name="course" />
					<div>
						<label for="year">Year</label>
						<select id="year" name="year">
			  <option value="1">1</option>
			  <option value="2">2</option>
			  <option value="3">3</option>
							<option value="4">4</option>
						</select>
					</div>
	</div>

	<div class="actions">
					<button type="reset" class="secondary">Reset</button>
					<button type="submit" class="primary">Register Student</button>
				</div>
	</form>

	<section aria-labelledby="listHeading">
	<h3 id="listHeading">Registered Students</h3>

	<table class="students" aria-describedby="listHeading">
					<thead>
						<tr>
							<th>#</th>
			  <th>Name</th>
			  <th>Email</th>
			  <th>Course</th>
							<th>Year</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody id="studentsTableBody"></tbody>
				</table>
				<div id="users" class="cards"></div>
			</section>
		</div>
		<script>
			// Small helper to read/write students from localStorage
			const STORAGE_KEY = 'students';
			function loadStudents() {
				try {
					const raw = localStorage.getItem(STORAGE_KEY) || '[]';
					return JSON.parse(raw);
				} catch (e) {
					console.error('Failed to parse students from localStorage', e);
					return [];
				}
			}
			function saveStudents(list) {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
			}
			function render() {
				const students = loadStudents();
				const tbody = document.getElementById('studentsTableBody');
	const usersDiv = document.getElementById('users');

	// Clear
	tbody.innerHTML = '';
	usersDiv.innerHTML = '';

	students.forEach((s, i) => {
		  const tr = document.createElement('tr');

		  tr.innerHTML = `
			<td>${i + 1}</td>
			<td>${escapeHtml(s.name)}</td>
			<td>${escapeHtml(s.email)}</td>
			<td>${escapeHtml(s.course || '')}</td>
			<td>${escapeHtml(s.year || '')}</td>
			<td><button data-index="${i}" class="deleteBtn">Delete</button></td>
		  `;

		  tbody.appendChild(tr);
		  // card view
		  const card = document.createElement('div');
		  card.className = 'card';
					card.innerHTML = `
						<h4>${escapeHtml(s.name)}</h4>
						<div class="muted">${escapeHtml(s.email)}</div>
						<div class="muted">${escapeHtml(s.course || '—')} • Year ${escapeHtml(s.year || '—')}</div>
						<div style="margin-top:10px;text-align:right;"><button data-index="${i}" class="deleteBtn">Delete</button></div>
					`;
					usersDiv.appendChild(card);
				});

				// attach delete handlers (delegation could be used too)
				document.querySelectorAll('.deleteBtn').forEach((btn) => {
					btn.addEventListener('click', (e) => {
						const idx = Number(btn.getAttribute('data-index'));
			if (!Number.isFinite(idx)) return;
			if (!confirm('Delete this student?')) return;
			const arr = loadStudents();
			arr.splice(idx, 1);
			saveStudents(arr);
			render();
					});
				});
			}
			function escapeHtml(str) {
				if (!str) return '';
				return String(str)
		  .replace(/&/g, '&amp;')
		  .replace(/</g, '&lt;')
		  .replace(/>/g, '&gt;')
		  .replace(/"/g, '&quot;')
		  .replace(/'/g, '&#039;');
	  }

	  document.addEventListener('DOMContentLoaded', () => {
	const form = document.getElementById('studentForm');

	form.addEventListener('submit', (ev) => {
		  ev.preventDefault();
		  const name = document.getElementById('name').value.trim();
		  const email = document.getElementById('email').value.trim();
		  const course = document.getElementById('course').value.trim();
		  const year = document.getElementById('year').value;

		  if (!name || !email) {
						alert('Please provide name and email');
						return;
					}
		  const list = loadStudents();
		  list.push({ name, email, course, year });
		  saveStudents(list);
					form.reset();
					render();
				});
				render();
			});
		</script>
	</body>
</html>
<!DOCTYPE html> <html lang="en"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Student Registration Portal</title>     <style>         body {             font-family: Arial, sans-serif;             background: #e8e8e8;         }         .container {             width: 80%;             margin: 20px auto;             background: #fff;             padding: 20px;             border-radius: 8px;         }         input {             width: 95%;             padding: 10px;             margin: 8px 0;             border: 1px solid #ccc;             border-radius: 4px;         }         button {             padding: 10px 20px;             background: green;             color: #fff;             border: none;             cursor: pointer;             border-radius: 4px;             margin-top: 5px;         }         button:hover {             background: darkgreen;         }         table {             width: 100%;             border-collapse: collapse;             margin-top: 20px;         }         table,         th,         td {             border: 1px solid #000;         }         th,         td {             padding: 10px;             text-align: center;         }         th {             background: #e8e8e8;         }         #users {             display: flex;             flex-wrap: wrap;             gap: 10px;             margin-top: 20px;         }         .card {             width: 250px;             border: 1px solid gray;             padding: 10px;             border-radius: 8px;             background: #fafafa;         }         .card h3 {             color: green;             margin-top: 0;         }         .deleteBtn {             background: red;         }         .deleteBtn:hover {             background: darkred;         }     </style> </head> <body>     <div class="container">         <h2>Student Registration Portal</h2>          <form id="studentForm">             <input type="text" id="name" placeholder="Enter your Name">             <input type="text" id="roll" placeholder=" Enter your Roll Number">             <input type="email" id="email" placeholder="Email">             <input type="text" id="course" placeholder="Course">             <input type="text" id="mobile" placeholder="Mobile Number">             <input type="text" id="age" placeholder="Age">             <button type="submit">Register</button> <button type="Delete">Delete</button>         </form>          <h2>Registered Students</h2>         <table>             <thead>                 <tr>                     <th>Name</th>                     <th>Roll</th>                     <th>Email</th>                     <th>Course</th>                     <th>Mobile</th>                     <th>Age</th>                 </tr>             </thead>             <tbody id="studentTable"></tbody>         </table>          <hr>          <h2>Users from Local Storage</h2>         <button onclick="loadUsers()">Load Users</button>         <div id="users"></div>     </div>      <script>         const $ = id => document.getElementById(id);         const LS = key => JSON.parse(localStorage.getItem(key)) || [];         const setLS = (key, data) => localStorage.setItem(key, JSON.stringify(data));          const form = $('studentForm');         const table = $('studentTable');         //table data   const render = () => {             table.innerHTML = LS('students').map(s =>                 `<tr><td>${s.name}</td><td>${s.roll}</td><td>${s.email}</td><td>${s.course}</td><td>${ s.mobile}</td><td>${s.age}</td></tr>`             ).join('');         };         render();   //form handling          form.addEventListener('submit', e => {             e.preventDefault();             const [name, roll, email, course, mobile, age] = ['name', 'roll', 'email', 'course', 'mobile', 'age'].map(id => $(id).value             .trim());             if (!name || !roll || !email || !course || !mobile || !age) return alert('All fields required');             if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert('Invalid Email');             if (!/^[0-9]{10}$/.test(mobile)) return alert('Enter 10 digit mobile number');  //stored data to local storage              let students = LS('students');             students.push({ name, roll, email, course, mobile, age });             setLS('students', students);             form.reset();             render();             alert('Student registered successfully!');         }); // Cards          window.loadUsers = () => {             const students = LS('students');             const container = $('users');             container.innerHTML = students.length === 0 ? '<p>No registered students found.</p>' :                 students.map(s =>                     `<div class="card"><h3>${s.name}</h3><p><b>Roll:</b> ${s.roll}</p><p><b>Email:</b> ${s.email}</p><p><b>Course:</b> ${s.course}</p><p><b>Mobile:</b> ${s.mobile}</p><p><b>Age:</b> ${s.age}</p></div>`                 ).join('');         };     </script> </body> </html>
